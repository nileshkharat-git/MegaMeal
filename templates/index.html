  </head>
  <body>
    <h1>MegaMeal</h1>
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js"
      import {
        getMessaging,
        getToken,
        onMessage,
      } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-messaging.js"
      // TODO: Add SDKs for Firebase products that you want to use
      // https://firebase.google.com/docs/web/setup#available-libraries

      // Your web app's Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyBuYmFoS7JSIkdxGdLK8wkdgVKCQQz4sHM",
        authDomain: "pushnotification-1cb52.firebaseapp.com",
        projectId: "pushnotification-1cb52",
        storageBucket: "pushnotification-1cb52.firebasestorage.app",
        messagingSenderId: "1078298717632",
        appId: "1:1078298717632:web:4ddb034a44d7597501ec25",
        measurementId: "G-9PYREZ4Q7R",
      }

      // Initialize Firebase
      const app = initializeApp(firebaseConfig)
      const messaging = getMessaging(app)
      messaging.onBackgroundMessage(payload => {
        self.registration.showNotification(payload.notification.title, {
          body: payload.notification.body,
        })
      })

      onMessage(messaging, payload => {
        console.log("Message received in foreground:", payload)
        new Notification(payload.notification.title, {
          body: payload.notification.body,
        })
      })
    </script>
  </body>
